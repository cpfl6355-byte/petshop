<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>댕냥메디 - 주문/결제</title>
  <link rel="stylesheet" href="style.css?v=20" />
  <!-- 토스페이먼츠 결제 SDK 로드 -->
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <style>
    .sub-scroll-area {
      overflow-y: auto;
      height: calc(100% - 60px);
      padding: 20px 16px 120px;
      background-color: #fdfbf7;
    }
    
    .checkout-header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #ede5da;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      color: #3d2c1e;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.2s;
      margin-right: 8px;
    }
    .back-btn:hover {
      background: #f5eedf;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #2e1d0e;
    }

    /* 카드형 섹션 공통 */
    .section-card {
      background: #fff;
      border: 1px solid #ede5da;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(92, 61, 30, 0.03);
    }
    .section-title-sub {
      font-size: 14.5px;
      font-weight: 700;
      color: #2e1d0e;
      border-bottom: 1px solid #f5eedf;
      padding-bottom: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 배송 정보 입력 폼 */
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    .form-label {
      font-size: 12.5px;
      font-weight: 700;
      color: #8c7664;
    }
    .form-input {
      width: 100%;
      height: 46px;
      border: 1px solid #ede5da;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 13.5px;
      color: #3d2c1e;
      background-color: #faf8f5;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .form-input:focus {
      background-color: #fff;
      border-color: #d88373;
      box-shadow: 0 0 0 3px rgba(216, 131, 115, 0.15);
      outline: none;
    }

    /* 주문 상품 요약 목록 */
    .order-items-summary {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .summary-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #f5eedf;
    }
    .summary-item-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .summary-item-img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #ede5da;
      background: #faf7f2;
    }
    .summary-item-info {
      flex: 1;
      min-width: 0;
    }
    .summary-item-name {
      font-size: 13px;
      font-weight: 700;
      color: #3d2c1e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .summary-item-qty {
      font-size: 11.5px;
      color: #a49182;
      margin-top: 2px;
    }
    .summary-item-price {
      font-size: 13px;
      font-weight: 700;
      color: #2e1d0e;
    }

    /* 결제 수단 선택 UI */
    .payment-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .payment-card {
      border: 1px solid #ede5da;
      border-radius: 16px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
      user-select: none;
    }
    .payment-card:hover {
      border-color: #c4b5a8;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(92, 61, 30, 0.05);
    }
    .payment-card.active {
      border-color: #6b4c35;
      background: #faf6f0;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(107, 76, 53, 0.1);
    }
    .payment-card.active::after {
      content: '✓';
      position: absolute;
      top: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      background: #6b4c35;
      color: #fff;
      border-radius: 50%;
      font-size: 9px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pay-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .pay-icon-kakaopay { background: #fee500; }
    .pay-icon-card { background: #f0ece4; }
    .pay-icon-naverpay { background: #03c75a; color: white; font-weight: bold; font-size: 14px; }
    .pay-icon-tosspay { background: #0064ff; color: white; font-weight: bold; font-size: 14px; }
    
    .payment-card-name {
      font-size: 11px;
      font-weight: 700;
      color: #3d2c1e;
      text-align: center;
    }

    /* 금액 요약 */
    .bill-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      color: #8c7664;
    }
    .bill-row.total {
      margin-bottom: 0;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #ede5da;
      font-size: 15px;
      font-weight: 700;
      color: #2e1d0e;
    }
    .bill-row.total .price {
      color: #d88373;
    }

    /* 하단 고정 결제하기 영역 */
    .checkout-footer-sticky {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px 24px;
      background: #fff;
      border-top: 1px solid #ede5da;
      z-index: 10;
    }
    .btn-checkout-pay {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #6b4c35 0%, #3d2c1e 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(61, 44, 30, 0.25);
      transition: all 0.2s;
    }
    .btn-checkout-pay:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(61, 44, 30, 0.35);
    }
    .btn-checkout-pay:active {
      transform: translateY(0);
    }

    /* 결제 모달 오버레이 */
    .pay-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.25s ease-out;
    }

    /* 결제 모달 카드 */
    .pay-modal-card {
      width: 85%;
      max-width: 340px;
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      position: relative;
    }

    .pay-modal-method-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #3d2c1e;
      background-color: #faf6f0;
      border: 1px solid #ede5da;
      margin-bottom: 16px;
    }

    .pay-modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #2e1d0e;
      margin-bottom: 24px;
    }

    /* 비밀번호 도트 */
    .pay-pwd-dots {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    
    .pwd-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ede5da;
      background-color: transparent;
      transition: all 0.2s ease;
    }
    
    .pwd-dot.filled {
      background-color: #6b4c35;
      border-color: #6b4c35;
      transform: scale(1.1);
    }

    /* 스피너 및 완료 박스 */
    .pay-loading-box {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .pay-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(107, 76, 53, 0.2);
      border-top-color: #6b4c35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .pay-loading-text {
      font-size: 12px;
      color: #a49182;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 신용카드 세부 입력 폼 슬라이드 효과 */
    .card-input-form {
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      border-top: 1px dashed #ede5da;
      padding-top: 0;
    }
    .card-input-form.show {
      max-height: 300px;
      opacity: 1;
      margin-top: 14px;
      padding-top: 14px;
    }
  </style>
</head>
<body>
  <div class="desktop-wrapper">
    <!-- 왼쪽 데스크탑 랜딩 페이지 컨텐츠 (동일 템플릿 유지) -->
    <div class="desktop-left">
      <div class="dl-logo">
        <img src="logo.png" alt="귀여운 강아지 고양이 로고" class="dl-logo-img" />
        <div class="dl-logo-text">
          <h2>댕냥메디</h2>
          <p>DAENGNYANG MEDI</p>
        </div>
      </div>

      <div class="dl-hero">
        <p class="dl-hero-sub">맞춤케어 쇼핑몰</p>
        <h1 class="dl-hero-title">댕냥메디</h1>
        <p class="dl-hero-desc">우리 아이 건강을 위한 모든 맞춤 케어 솔루션</p>
      </div>

      <div class="dl-bottom">
        <div class="dl-store-btns">
          <button class="dl-store-btn">GET IT ON<br><b>Google Play</b></button>
          <button class="dl-store-btn">Download on the<br><b>App Store</b></button>
        </div>
      </div>
    </div>

    <!-- 우측 모바일 앱 프레임 -->
    <div class="desktop-right">
      <div class="app" style="padding-top: 0;">
        <!-- 상단 헤더 -->
        <header class="checkout-header">
          <a href="cart.html" class="back-btn" aria-label="뒤로가기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </a>
          <span class="header-title">주문/결제</span>
        </header>

        <!-- 스크롤 영역 -->
        <main class="sub-scroll-area">
          
          <!-- 1. 배송지 정보 -->
          <div class="section-card">
            <div class="section-title-sub">🚚 배송지 정보</div>
            <div class="form-group">
              <label class="form-label" for="recipientInput">받는 사람</label>
              <input type="text" id="recipientInput" class="form-input" value="홍길동" placeholder="이름을 입력해주세요" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="contactInput">연락처</label>
              <input type="tel" id="contactInput" class="form-input" value="010-1234-5678" placeholder="휴대폰 번호를 입력해주세요" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="addressInput">배송 주소</label>
              <input type="text" id="addressInput" class="form-input" value="서울특별시 강남구 테헤란로 댕냥타워 7층" placeholder="상세 주소를 입력해주세요" required />
            </div>
          </div>

          <!-- 2. 주문 상품 목록 -->
          <div class="section-card">
            <div class="section-title-sub">🛍️ 주문 상품 목록</div>
            <div class="order-items-summary" id="orderItemsSummary">
              <!-- JS 동적 로드 -->
            </div>
          </div>

          <!-- 3. 결제 수단 선택 -->
          <div class="section-card">
            <div class="section-title-sub">💳 결제 수단</div>
            <div class="payment-grid">
              <!-- 토스페이 -->
              <div class="payment-card active" data-method="TossPay" id="payMethodToss">
                <div class="pay-icon-box pay-icon-tosspay">T</div>
                <span class="payment-card-name">토스페이</span>
              </div>
              <!-- 일반결제 -->
              <div class="payment-card" data-method="CreditCard" id="payMethodCard">
                <div class="pay-icon-box pay-icon-card">💳</div>
                <span class="payment-card-name">일반결제<br><small style="font-size: 9px; color: #a49182;">(신용/체크카드)</small></span>
              </div>
            </div>

            <!-- 신용/체크카드 상세 입력 폼 (일반결제 선택 시 노출) -->
            <div class="card-input-form" id="cardInputForm">
              <div class="form-group" style="margin-bottom: 10px;">
                <label class="form-label" style="font-size: 11.5px; color: #8c7664;">카드번호 16자리</label>
                <input type="text" id="cardNumberInput" class="form-input" placeholder="0000 0000 0000 0000" maxlength="19" />
              </div>
              <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                  <label class="form-label" style="font-size: 11.5px; color: #8c7664;">유효기간</label>
                  <input type="text" id="cardExpiryInput" class="form-input" placeholder="MM/YY" maxlength="5" />
                </div>
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                  <label class="form-label" style="font-size: 11.5px; color: #8c7664;">비밀번호 앞 2자리</label>
                  <input type="password" id="cardPwInput" class="form-input" placeholder="●●" maxlength="2" />
                </div>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" style="font-size: 11.5px; color: #8c7664;">생년월일 6자리</label>
                <input type="text" id="cardBirthInput" class="form-input" placeholder="YYMMDD" maxlength="6" />
              </div>
            </div>
          </div>

          <!-- 4. 결제 금액 정보 -->
          <div class="section-card">
            <div class="section-title-sub">💵 결제 금액 정보</div>
            <div class="bill-row">
              <span>상품 금액</span>
              <span id="subtotalPrice">0원</span>
            </div>
            <div class="bill-row">
              <span>배송비</span>
              <span id="shippingPrice">0원</span>
            </div>
            <div class="bill-row total">
              <span>총 결제금액</span>
              <span class="price" id="totalPrice">0원</span>
            </div>
          </div>

        </main>

        <!-- 하단 고정 결제 버튼 -->
        <footer class="checkout-footer-sticky">
          <button class="btn-checkout-pay" id="paySubmitBtn">결제하기 (0원)</button>
        </footer>

        <!-- 결제 비밀번호 모달 -->
        <div class="pay-modal-overlay" id="payModalOverlay" style="display: none;">
          <div class="pay-modal-card">
            <div class="pay-modal-header">
              <span class="pay-modal-method-badge" id="payModalMethodBadge">카카오페이</span>
            </div>
            <div class="pay-modal-body">
              <h3 class="pay-modal-title">결제 비밀번호 6자리를 입력해주세요</h3>
              <!-- 비밀번호 도트 표시기 -->
              <div class="pay-pwd-dots">
                <span class="pwd-dot"></span>
                <span class="pwd-dot"></span>
                <span class="pwd-dot"></span>
                <span class="pwd-dot"></span>
                <span class="pwd-dot"></span>
                <span class="pwd-dot"></span>
              </div>
              <!-- 로딩 스피너 및 텍스트 -->
              <div class="pay-loading-box" id="payLoadingBox" style="display: none;">
                <div class="pay-spinner"></div>
                <p class="pay-loading-text">결제가 완료되었습니다</p>
              </div>
            </div>
          </div>
        </div>

      </div> <!-- /app -->
    </div> <!-- /.desktop-right -->
  </div> <!-- /.desktop-wrapper -->

  <script>
    // [Routing Variables]
    const PAYMENT_COMPLETE_URL = 'payment-complete.html';

    // 1. 토스페이먼츠 초기화 (발급받은 클라이언트 키 입력)
    // 테스트용 키는 항상 'test_ck_'로 시작합니다.
    const tossPayments = TossPayments("test_ck_P9BRQmyarYQaGpzpmqmarJ07KzLN");

    // Check if redirected back due to failure from Toss Payments
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('fail') === 'true') {
      alert('❌ 결제가 실패하였거나 취소되었습니다. 다시 시도해 주세요.');
    }

    // [Default/Fallback Mock Data]
    const defaultOrderItems = [
      {
        name: '관절 튼튼 파우더',
        price: 24000,
        quantity: 1,
        img: 'joint_supplements.png'
      },
      {
        name: '댕냥메디 면역튼튼 유산균',
        price: 28000,
        quantity: 2,
        img: 'digestive_care.png'
      }
    ];

    // [Load Cart Items]
    let rawItems = JSON.parse(localStorage.getItem('cart_items')) || [];
    // Filter checked/selected items only
    let checkedItems = rawItems.filter(item => {
      return (item.checked !== undefined) ? item.checked : ((item.selected !== undefined) ? item.selected : true);
    }).map(item => ({
      name: item.name || '댕냥메디 상품',
      price: item.priceNum || item.price || 0,
      quantity: item.qty || item.quantity || 1,
      img: item.image || item.img || 'joint_supplements.png'
    }));

    // If no checked items are available, fallback to mock data
    let useFallback = checkedItems.length === 0;
    let orderItems = useFallback ? defaultOrderItems : checkedItems;

    // Render Order Items
    const itemsContainer = document.getElementById('orderItemsSummary');
    itemsContainer.innerHTML = orderItems.map(item => `
      <div class="summary-item-row">
        <img src="${item.img}" alt="${item.name}" class="summary-item-img" />
        <div class="summary-item-info">
          <h4 class="summary-item-name">${item.name}</h4>
          <p class="summary-item-qty">수량 ${item.quantity}개</p>
        </div>
        <span class="summary-item-price">${(item.price * item.quantity).toLocaleString()}원</span>
      </div>
    `).join('');

    // Calculate Prices
    let subtotal = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    // Shipping: subtotal >= 50000 ? 0 : 3000
    let shipping = subtotal >= 50000 ? 0 : 3000;
    // Hardcoded override fallback match: Subtotal 80,000 KRW, Shipping 3,000 KRW, Total 83,000 KRW
    if (useFallback) {
      subtotal = 80000;
      shipping = 3000;
    }
    let total = subtotal + shipping;

    // Render Prices
    document.getElementById('subtotalPrice').textContent = `${subtotal.toLocaleString()}원`;
    document.getElementById('shippingPrice').textContent = shipping === 0 ? '무료' : `${shipping.toLocaleString()}원`;
    document.getElementById('totalPrice').textContent = `${total.toLocaleString()}원`;
    
    // Update Pay Button
    const paySubmitBtn = document.getElementById('paySubmitBtn');
    paySubmitBtn.textContent = `Pay ${total.toLocaleString()} KRW`;

    // [Payment Selector Handling]
    let selectedMethod = 'TossPay';
    const payCards = document.querySelectorAll('.payment-card');
    const cardInputForm = document.getElementById('cardInputForm');

    payCards.forEach(card => {
      card.addEventListener('click', () => {
        payCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedMethod = card.dataset.method;

        // Toggle card details input form with class
        if (selectedMethod === 'CreditCard') {
          cardInputForm.classList.add('show');
        } else {
          cardInputForm.classList.remove('show');
        }
      });
    });

    // Format Card Number (adds spaces every 4 digits)
    const cardNum = document.getElementById('cardNumberInput');
    if (cardNum) {
      cardNum.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        let formatted = '';
        for (let i = 0; i < value.length && i < 16; i++) {
          if (i > 0 && i % 4 === 0) {
            formatted += ' ';
          }
          formatted += value[i];
        }
        e.target.value = formatted;
      });
    }

    // Format Expiry (adds / after 2 digits)
    const cardExp = document.getElementById('cardExpiryInput');
    if (cardExp) {
      cardExp.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        let formatted = '';
        if (value.length > 2) {
          formatted = value.substring(0, 2) + '/' + value.substring(2, 4);
        } else {
          formatted = value;
        }
        e.target.value = formatted;
      });
    }

    // [Pay button click]
    paySubmitBtn.addEventListener('click', (e) => {
      e.preventDefault();
      
      const recipientInput = document.getElementById('recipientInput');
      const contactInput = document.getElementById('contactInput');
      const addressInput = document.getElementById('addressInput');

      const recipient = recipientInput.value.trim();
      const contact = contactInput.value.trim();
      const address = addressInput.value.trim();

      // 1. Recipient Validation
      if (recipient === "") {
        alert('받는 사람 이름을 입력해 주세요.');
        recipientInput.focus();
        return;
      }

      // 2. Contact Validation
      const phoneRegex = /^010-?\d{3,4}-?\d{4}$/;
      if (!phoneRegex.test(contact)) {
        alert('올바른 연락처 형식을 입력해 주세요. (예: 010-1234-5678)');
        contactInput.focus();
        return;
      }

      // 3. Shipping Address Validation
      if (address === "") {
        alert('배송 주소를 입력해 주세요.');
        addressInput.focus();
        return;
      }

      // 4. Card Details Validation (if CreditCard is active)
      if (selectedMethod === 'CreditCard') {
        const cardNumberInput = document.getElementById('cardNumberInput');
        const cardExpiryInput = document.getElementById('cardExpiryInput');
        const cardPwInput = document.getElementById('cardPwInput');
        const cardBirthInput = document.getElementById('cardBirthInput');

        const cardNo = cardNumberInput.value.replace(/\s/g, ''); // strip spaces
        const cardExpiry = cardExpiryInput.value.trim();
        const cardPw = cardPwInput.value.trim();
        const cardBirth = cardBirthInput.value.trim();

        if (cardNo.length !== 16 || isNaN(cardNo)) {
          alert('카드번호 16자리를 올바르게 입력해 주세요.');
          cardNumberInput.focus();
          return;
        }

        const expiryRegex = /^(0[1-9]|1[0-2])\/?([0-9]{2})$/;
        if (!expiryRegex.test(cardExpiry)) {
          alert('올바른 유효기간(MM/YY) 형식을 입력해 주세요.');
          cardExpiryInput.focus();
          return;
        }

        if (cardPw.length !== 2 || isNaN(cardPw)) {
          alert('카드 비밀번호 앞 2자리를 입력해 주세요.');
          cardPwInput.focus();
          return;
        }

        if (cardBirth.length !== 6 || isNaN(cardBirth)) {
          alert('생년월일 6자리를 올바르게 입력해 주세요. (예: 950101)');
          cardBirthInput.focus();
          return;
        }
      }

      // Format payment method text for payment-complete page
      let methodText = '토스페이 (TossPay)';
      if (selectedMethod === 'CreditCard') {
        methodText = '일반결제 (신용/체크카드)';
      }

      // Generate a dynamic Order ID based on current date
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const randomNum = String(Math.floor(1000 + Math.random() * 9000));
      const orderId = `${yyyy}${mm}${dd}-${randomNum}`;

      // Save Order details to localStorage
      const latestOrder = {
        orderId: orderId,
        items: orderItems,
        subtotal: subtotal,
        shipping: shipping,
        total: total,
        payMethod: methodText,
        recipient: recipient,
        contact: contact,
        address: address,
        date: today.toLocaleDateString('ko-KR')
      };
      localStorage.setItem('latest_order', JSON.stringify(latestOrder));

      // Remove purchased checked items from cart in localStorage (if we didn't use fallback)
      if (!useFallback) {
        let remainingItems = rawItems.filter(item => {
          return !((item.checked !== undefined) ? item.checked : ((item.selected !== undefined) ? item.selected : true));
        });
        localStorage.setItem('cart_items', JSON.stringify(remainingItems));
      }

      // If TossPay is selected, execute the Toss Payments client SDK payment request
      if (selectedMethod === 'TossPay') {
        const orderName = orderItems[0].name + (orderItems.length > 1 ? ' 외 ' + (orderItems.length - 1) + '건' : '');
        
        tossPayments.requestPayment('간편결제', {
          provider: 'TOSSPAY',                                           // 간편결제사로 토스페이 지정
          amount: total,                                                 // 결제 금액
          orderId: orderId,                                               // 주문번호 (매번 랜덤하게 생성)
          orderName: orderName,                                           // 주문명
          customerName: recipient,                                        // 구매자 이름
          successUrl: window.location.origin + '/payment-complete.html?payMethod=' + encodeURIComponent(methodText) + '&price=' + total, // 결제 성공 시 이동할 페이지
          failUrl: window.location.origin + '/checkout.html?fail=true'                                                                   // 결제 실패 시 이동할 페이지
        }).catch(function (error) {
          alert('결제 오류: ' + error.message);
        });
        return; // Stop execution since Toss Payments handles redirection
      }

      // Show payment simple password modal
      const payModalOverlay = document.getElementById('payModalOverlay');
      const payModalMethodBadge = document.getElementById('payModalMethodBadge');
      const payLoadingBox = document.getElementById('payLoadingBox');
      const dots = document.querySelectorAll('.pwd-dot');
      
      // Clear dot states
      dots.forEach(dot => dot.classList.remove('filled'));
      payLoadingBox.style.display = 'none';

      // Set method badge text/icon
      let badgeHtml = '💙 토스페이';
      if (selectedMethod === 'CreditCard') {
        badgeHtml = '💳 일반결제 (신용/체크카드)';
      }
      payModalMethodBadge.innerHTML = badgeHtml;

      // Show Modal
      payModalOverlay.style.display = 'flex';

      // 1. Password filling animation (1 second total, 6 dots, so roughly every 160ms)
      let dotIndex = 0;
      const fillInterval = setInterval(() => {
        if (dotIndex < dots.length) {
          dots[dotIndex].classList.add('filled');
          dotIndex++;
        } else {
          clearInterval(fillInterval);
          // 2. Password complete, show loading spinner for 0.5s
          payLoadingBox.style.display = 'flex';
          
          setTimeout(() => {
            // Hide modal and redirect to payment-complete.html
            payModalOverlay.style.display = 'none';
            window.location.href = `${PAYMENT_COMPLETE_URL}?payMethod=${encodeURIComponent(methodText)}&price=${total}`;
          }, 500);
        }
      }, 160);
    });
  </script>
</body>
</html>
