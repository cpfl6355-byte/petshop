<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 상세 - 댕냥메디</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="products.js"></script>
  <style>
    .prd-img { width: 100%; height: 320px; object-fit: cover; background: #fdfbf8; }
    .prd-info { padding: 20px; background: #fff; border-bottom: 8px solid #f9f9f9; }
    .prd-brand { font-size: 13px; color: #a49688; margin-bottom: 6px; }
    .prd-name { font-size: 22px; font-weight: 700; color: #3d2c1e; margin-bottom: 12px; line-height: 1.3; }
    .prd-price { font-size: 24px; font-weight: 700; color: #d88373; margin-bottom: 20px; }
    
    .prd-cta { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 12px 20px; background: #fff; border-top: 1px solid #f0e6da; display: flex; gap: 12px; box-sizing: border-box; z-index: 100; }
    .btn-buy { flex: 1; background: #3d2c1e; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-cart { width: 52px; height: 52px; background: #fdfbf8; border: 1px solid #e6dccf; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* Component Styles */
    .section-container { padding: 32px 20px; background: #fff; border-bottom: 1px solid #f0e6da; }
    .section-container-dark { padding: 32px 20px; background: #eee5d9; border-bottom: 1px solid #e0d5c8; }
    .section-title { font-size: 18px; font-weight: 800; color: #3d2c1e; margin-bottom: 20px; text-align: center; }
    
    .review-media-scroll { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-bottom: 16px; }
    .review-media-scroll::-webkit-scrollbar { display: none; }
    
    /* SymptomIntro */
    .symptom-intro { text-align: center; }
    .symptom-intro h3 { font-size: 24px; font-weight: 800; color: #3d2c1e; line-height: 1.4; margin-bottom: 16px; }
    .symptom-intro p { font-size: 15px; color: #665a4f; line-height: 1.6; }
    .symptom-intro .highlight { color: #e87a7a; }
    
    /* IngredientGrid */
    .ingredient-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .ingredient-item { text-align: center; background: #fff; padding: 16px 8px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .ingredient-icon { font-size: 28px; margin-bottom: 8px; }
    .ingredient-name { font-size: 14px; font-weight: 700; color: #3d2c1e; margin-bottom: 4px; }
    .ingredient-desc { font-size: 12px; color: #887a6a; line-height: 1.3; }

    /* DosageTable */
    .dosage-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
    .dosage-table th { background: #f5f0eb; padding: 12px; font-weight: 700; color: #3d2c1e; border: 1px solid #e6dccf; }
    .dosage-table td { padding: 12px; border: 1px solid #e6dccf; color: #5a4b3c; }

    /* SafetyCert */
    .safety-cert { text-align: center; background: #fff; padding: 24px; border-radius: 12px; border: 1px dashed #d8c9b8; }
    .cert-badges { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .cert-badge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .cert-badge span { font-size: 11px; font-weight: 700; color: #a49688; }
    .safety-warning { font-size: 13px; color: #e87a7a; line-height: 1.4; text-align: left; }

    /* ReviewFAQ */
    .review-item { border-bottom: 1px solid #f0e6da; padding-bottom: 16px; margin-bottom: 16px; }
    .review-stars { color: #f5b041; font-size: 12px; margin-bottom: 4px; }
    .review-user { font-size: 12px; color: #a49688; margin-bottom: 8px; }
    .review-text { font-size: 14px; color: #5a4b3c; line-height: 1.5; }
    
    .faq-item { margin-bottom: 12px; border-bottom: 1px solid #f0e6da; padding-bottom: 12px; }
    .faq-q { font-size: 15px; font-weight: 700; color: #3d2c1e; cursor: pointer; display: flex; justify-content: space-between; }
    .faq-a { font-size: 14px; color: #665a4f; margin-top: 8px; line-height: 1.5; display: none; }
    .faq-q.open + .faq-a { display: block; }
  </style>
</head>
<body>

    function findProductById(id) {
      let targetId = id;

      if (id === 'prod_joint_01') targetId = 'joint_01';
      if (id === 'prod_eye_02') targetId = 'eye_02';

      for (const category in MOCK_PRODUCTS) {
        const found = MOCK_PRODUCTS[category].find(p => p.id === targetId);
        if (found) {
          return { product: found, category: category };
        }
      }
      return null;
    }

        // Add to wish list
        wishList.push(productId);
        btnEl.style.color = '#e87a7a';
        svgEl.setAttribute('fill', '#e87a7a');
        svgEl.setAttribute('stroke', '#e87a7a');
        // Visual pop effect
        btnEl.style.transform = "scale(1.2)";
        setTimeout(() => btnEl.style.transform = "scale(1)", 200);
      }
      localStorage.setItem('wish_list', JSON.stringify(wishList));
    };

    // Global function for Cart / Checkout Navigation
    window.addToCartAndGo = function(isBuyNow = false) {
      try {
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('productId') || "eye_cleanser";
        const lookup = findProductById(pid);
        let product = null;
        if (lookup) {
          const detailData = buildProductDetailData(lookup.product, lookup.category);
          product = {
            name: detailData.name,
            price: detailData.price,
            image: detailData.image
          };
        } else {
          product = PRODUCT_DB[pid] || PRODUCT_DB["eye_cleanser"];
        }
        
        let cart = JSON.parse(localStorage.getItem('cart_items') || '[]');
        const existingItem = cart.find(i => i.id === pid);
        if (existingItem) {
          existingItem.qty += 1;
        } else {
          cart.push({
            id: pid,
            name: product.name,
            priceNum: parseInt(product.price.replace(/[^0-9]/g, '')),
            image: product.image || product.img,
            qty: 1,
            checked: true,
            selectedOption: "단품 1개"
          });
        }
        localStorage.setItem('cart_items', JSON.stringify(cart));
        
        const targetStep = isBuyNow ? 'checkout' : 'cart';
        window.location.href = `index.html?openFlow=true&step=${targetStep}`;
      } catch (err) {
        alert("장바구니 이동 중 오류가 발생했습니다: " + err.message);
      }
    };

    // Global function for coupon download
    window.downloadCoupon = function() {
      const downloaded = localStorage.getItem('new_member_coupon_downloaded');
      if (downloaded === 'true') return;
      
      const couponBox = document.getElementById('productCouponBox');
      const couponText = document.getElementById('productCouponText');
      const couponIcon = document.getElementById('productCouponIcon');
      
      if (couponIcon) couponIcon.textContent = "발급 중...";
      if (couponBox) couponBox.style.pointerEvents = "none";
      
      setTimeout(() => {
        localStorage.setItem('new_member_coupon_downloaded', 'true');
        alert("웰컴 쿠폰팩이 성공적으로 발급되었습니다! 결제 단계에서 사용할 수 있습니다. 🎉");
        
        if (couponText) {
          couponText.textContent = "10,000원 쿠폰팩 발급 완료!";
          couponText.style.color = "#a49688";
        }
        if (couponIcon) couponIcon.style.display = "none";
        if (couponBox) {
          couponBox.style.background = "#faf8f5";
          couponBox.style.borderColor = "#e6dccf";
          couponBox.style.cursor = "default";
        }
      }, 800);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('productId') || "eye_cleanser";
      renderProductPage(pid);
      
      // Initialize coupon UI state
      const downloaded = localStorage.getItem('new_member_coupon_downloaded');
      const used = localStorage.getItem('new_member_coupon_used');
      const couponBox = document.getElementById('productCouponBox');
      const couponText = document.getElementById('productCouponText');
      const couponIcon = document.getElementById('productCouponIcon');
      
      if (used === 'true') {
        if(couponBox) couponBox.style.display = 'none';
      } else if (downloaded === 'true') {
        if(couponText) {
          couponText.textContent = "10,000원 쿠폰팩 발급 완료!";
          couponText.style.color = "#a49688";
        }
        if(couponIcon) couponIcon.style.display = 'none';
        if(couponBox) {
          couponBox.style.background = "#faf8f5";
          couponBox.style.borderColor = "#e6dccf";
          couponBox.style.cursor = "default";
          couponBox.onclick = null;
        }
      }
    });
  </script>
</body>
</html>
