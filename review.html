<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>댕냥메디 - 만족 후기</title>
  <link rel="stylesheet" href="style.css?v=19">
  <style>
    .subpage-container {
      padding: 40px 20px;
      text-align: center;
      background: #fff;
      max-width: 390px;
      min-height: 100vh;
      margin: 0 auto;
      border-left: 1px solid #ede5da;
      border-right: 1px solid #ede5da;
      box-shadow: 0 0 20px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .subpage-title {
      font-size: 24px;
      font-weight: 700;
      color: #2e1d0e;
    }
    .subpage-desc {
      font-size: 14px;
      color: #8c7664;
      line-height: 1.6;
    }
    .home-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #e87a7a 0%, #c95b5b 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(232,122,122,0.3);
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(232,122,122,0.4);
    }
    .home-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="subpage-container">
    <div class="subpage-title">⭐ 제품 및 만족 후기</div>
    <p class="subpage-desc">실제 보호자님들이 남긴 리얼 구매 리뷰와 AI 맞춤 처방 후 개선 사례 및 만족도 점수를 투명하게 확인할 수 있습니다.</p>
    <button class="home-btn" onclick="window.location.href='index.html'">🏠 홈으로 가기</button>
  </div>
</body>
</html>
